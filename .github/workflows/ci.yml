name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11 + Tk + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common xvfb
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get install -y python3.11 python3.11-tk python3-tk

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt
          python3.11 -m pip install --break-system-packages -r requirements.txt

      - name: Ruff (error-only checks)
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Tests (system Python)
        run: |
          xvfb-run -a python3 tests/test_login.py
          xvfb-run -a python3 tests/test_ui.py
          xvfb-run -a python3 tests/test_integration.py

      - name: Tests (Python 3.11)
        run: |
          xvfb-run -a python3.11 tests/test_login.py
          xvfb-run -a python3.11 tests/test_ui.py
          xvfb-run -a python3.11 tests/test_integration.py
